<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lean blueprints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --forest:#1c2024; --bright:#3dd68c; --bright-ink:#0f2a1e; --mint:#e3f8ee;
  --paper:#f6f7f6; --card:#ffffff; --ink:#1c2024; --muted:#646b75; --line:#e3e6e9; --warn:#b4232c;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--paper:#121518;--card:#1a1e22;--ink:#e8eaed;--muted:#9aa2ad;--line:#2c3238;--mint:#16382a;--warn:#ff7b84}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.bar{background:var(--forest);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 28px}
.bar .mark{width:26px;height:26px;border-radius:7px;background:var(--bright);display:grid;place-items:center;color:var(--bright-ink);font-weight:800;font-size:14px}
.bar h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.01em}
.bar .spacer{flex:1}
.bar button{background:transparent;border:1px solid #3a4148;color:#d6dade;border-radius:8px;padding:6px 12px;cursor:pointer}
.bar button:hover{border-color:var(--bright);color:#fff}

/* sign in */
.signin{max-width:380px;margin:12vh auto;padding:0 20px}
.signin h2{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.signin p{color:var(--muted);margin:0 0 22px}
label{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
input[type=text],input[type=password],select{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
.primary{background:var(--bright);color:var(--bright-ink);border:0;border-radius:10px;height:44px;padding:0 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.primary:hover{filter:brightness(.95)}
.primary[disabled]{opacity:.6;cursor:default}
.err{color:var(--warn);font-size:13.5px;margin-top:10px;min-height:1.4em}
#shareErr:empty,#upErr:empty{min-height:0;margin:0}

/* layout */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 54px)}
.side{border-right:1px solid var(--line);padding:22px 16px;background:var(--card)}
.side h2{font-size:13px;font-weight:700;color:var(--muted);margin:0 8px 10px}
.bp{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:11px 12px;cursor:pointer;margin-bottom:2px}
.bp:hover{background:var(--paper)}
.bp[aria-current="true"]{background:var(--mint)}
.bp .t{font-weight:700;font-size:14px;line-height:1.35;display:block}
.bp .s{font-size:12.5px;color:var(--muted)}
.meter{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bright)}
.main{padding:28px 36px 60px;max-width:1100px;min-width:0}
.main h2{overflow-wrap:anywhere;font-size:28px;font-weight:800;margin:0 0 4px;letter-spacing:-.015em;line-height:1.2}
.main .sub{color:var(--muted);margin:0 0 26px}
section{margin-bottom:34px}
section h3{font-size:16px;font-weight:700;margin:0 0 12px}
.share{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:12px;align-items:end}
.created{margin-top:12px;background:var(--mint);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.created code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;flex:1;min-width:200px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600}
.ghost:hover{border-color:var(--bright)}
.ghost.danger:hover{border-color:var(--warn);color:var(--warn)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .who{font-weight:700}
td .by{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.tag.client{background:var(--mint);border-color:transparent;color:var(--ink)}
.revoked td{opacity:.55}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.never{color:var(--muted)}
.actions{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted)}
.visit{display:grid;grid-template-columns:160px 1fr auto;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:baseline}
.visit:last-child{border-bottom:0}
.visit time{font-size:13px;color:var(--muted)}
.visit .d{font-size:13px;color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px}
.addbp{width:100%;margin:0 0 12px;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px}
.upload{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;max-width:560px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
input[type=file]{width:100%;font-size:14px}
.metaline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 26px}
.metaline .sub{margin:0}
.warn{background:#fff4e5;color:#7a4b00;border-radius:12px;padding:12px 14px;font-size:13.5px;margin:-12px 0 24px}
@media (prefers-color-scheme:dark){.warn{background:#3a2a10;color:#ffd699}}
.status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:22px 18px 50px}
  .share{grid-template-columns:1fr}
  .visit{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="bar"><div class="mark" aria-hidden="true">L</div><h1>Lean blueprints</h1><div class="spacer"></div><button id="signout" hidden>Sign out</button></div>

<div id="signin" class="signin" hidden>
  <h2>Sign in</h2>
  <p>Use the admin password your team set for this site.</p>
  <form id="signinForm">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div style="margin-top:14px"><button class="primary" type="submit">Sign in</button></div>
    <div class="err" id="signinErr" role="alert"></div>
  </form>
</div>

<div id="app" class="app" hidden>
  <nav class="side" aria-label="Blueprints">
    <h2>Blueprints</h2>
    <div id="bpList"></div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
(() => {
  const KEY = 'leanbp-admin';
  let password = sessionStorage.getItem(KEY) || '';
  let data = null;
  const NEW = '__new';
  let selected = location.hash === '#new' ? NEW : (location.hash.slice(1) || null);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function api(path, opts = {}) {
    const r = await fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + password, ...(opts.headers || {}) },
    });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { signOut(); throw new Error('Wrong admin password'); }
    if (!r.ok) throw new Error(body.error || 'Request failed');
    return body;
  }

  function signOut() {
    password = '';
    sessionStorage.removeItem(KEY);
    $('app').hidden = true;
    $('signout').hidden = true;
    $('signin').hidden = false;
  }

  $('signinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    password = $('pw').value;
    $('signinErr').textContent = '';
    try {
      await load();
      sessionStorage.setItem(KEY, password);
    } catch (err) {
      $('signinErr').textContent = err.message;
    }
  });
  $('signout').addEventListener('click', signOut);

  async function load() {
    data = await api('/api/admin/overview');
    $('signin').hidden = true;
    $('app').hidden = false;
    $('signout').hidden = false;
    if (selected !== NEW && !data.blueprints.some((b) => b.slug === selected)) selected = data.blueprints[0]?.slug || NEW;
    render();
  }

  const when = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const mins = Math.round((Date.now() - d) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  };
  const full = (iso) => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const dur = (s) => {
    s = Number(s) || 0;
    if (s < 60) return s + ' sec';
    const m = Math.round(s / 60);
    return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  };
  const device = (ua) => {
    ua = ua || '';
    const os = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : '';
    const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '';
    return [br, os].filter(Boolean).join(' on ');
  };

  function render() {
    $('bpList').innerHTML = `<button class="ghost addbp" id="addBp" aria-current="${selected === NEW}">Add a blueprint</button>` + (data.blueprints.length
      ? data.blueprints.map((b) => `
        <button class="bp" data-slug="${esc(b.slug)}" aria-current="${b.slug === selected}">
          <span class="t">${esc(b.title)}</span>
          <span class="s">${b.items ? `${b.done} of ${b.items} checklist items done` : 'No checklist items'}</span>
          ${b.items ? `<div class="meter" aria-hidden="true"><i style="width:${Math.round((b.done / b.items) * 100)}%"></i></div>` : ''}
        </button>`).join('')
      : '<p class="s" style="margin:0 8px;color:var(--muted)">No blueprints yet.</p>');
    $('addBp').addEventListener('click', () => { selected = NEW; history.replaceState(null, '', '#new'); render(); });
    document.querySelectorAll('.bp').forEach((el) => el.addEventListener('click', () => {
      selected = el.dataset.slug;
      history.replaceState(null, '', '#' + selected);
      render();
    }));

    const bp = data.blueprints.find((b) => b.slug === selected);
    if (!bp) return renderUpload();
    const links = data.links.filter((l) => l.slug === bp.slug);
    const visits = data.recent.filter((v) => v.slug === bp.slug);
    const lastClient = visits.find((v) => v.kind === 'client');

    $('main').innerHTML = `
      <h2>${esc(bp.title)}</h2>
      <div class="metaline">
        <p class="sub">${lastClient ? `Last opened by ${esc(lastClient.label)}, ${esc(when(lastClient.opened_at))}.` : 'Not opened by a client yet.'}
        File ${bp.uploaded_by ? 'uploaded by ' + esc(bp.uploaded_by) + ', ' : 'updated '}${esc(when(bp.updated_at))}.</p>
        <label class="ghost" style="margin:0;cursor:pointer">Replace file<input id="replaceFile" type="file" accept=".html,.htm,text/html" hidden></label>
      </div>
      <div id="replaceMsg"></div>

      <section>
        <h3>Share a link</h3>
        <form class="share" id="shareForm">
          <div><label for="label">Who is it for</label><input id="label" type="text" maxlength="80" placeholder="Name and company, e.g. David at Wise" required></div>
          <div><label for="kind">Type</label><select id="kind"><option value="client">Client</option><option value="internal">Lean teammate</option></select></div>
          <div><label for="by">Your name</label><input id="by" type="text" maxlength="80" value="${esc(localStorage.getItem('leanbp-by') || '')}"></div>
          <div><button class="primary" type="submit">Create link</button></div>
        </form>
        <div class="err" id="shareErr" role="alert"></div>
        <div id="created"></div>
      </section>

      <section>
        <h3>Links</h3>
        ${links.length ? `<div class="tablewrap"><table>
          <thead><tr><th>Who</th><th>Type</th><th>Visits</th><th>Last opened</th><th>Time on page</th><th></th></tr></thead>
          <tbody>${links.map((l) => `
            <tr class="${l.revoked_at ? 'revoked' : ''}">
              <td><div class="who">${esc(l.label)}</div><div class="by">${l.created_by ? 'Created by ' + esc(l.created_by) + ', ' : 'Created '}${esc(when(l.created_at))}${l.revoked_at ? ', revoked' : ''}</div></td>
              <td><span class="tag ${l.kind}">${l.kind === 'client' ? 'Client' : 'Lean'}</span></td>
              <td class="num">${l.views}</td>
              <td class="num" title="${esc(full(l.last_view))}">${l.last_view ? esc(when(l.last_view)) : '<span class="never">Not opened</span>'}</td>
              <td class="num">${l.views ? dur(l.seconds) : ''}</td>
              <td><div class="actions">
                ${l.revoked_at ? '' : `<button class="ghost" data-copy="${esc(l.token)}">Copy link</button>`}
                <button class="ghost ${l.revoked_at ? '' : 'danger'}" data-revoke="${esc(l.token)}" data-state="${l.revoked_at ? 'revoked' : 'active'}">${l.revoked_at ? 'Restore' : 'Revoke'}</button>
              </div></td>
            </tr>`).join('')}</tbody></table></div>`
          : '<div class="empty">No links yet. Create one above and send it to your client.</div>'}
      </section>

      <section>
        <h3>Recent visits</h3>
        ${visits.length ? `<div class="list">${visits.slice(0, 40).map((v) => `
          <div class="visit">
            <time datetime="${esc(v.opened_at)}" title="${esc(full(v.opened_at))}">${esc(full(v.opened_at))}</time>
            <div><strong>${esc(v.label)}</strong> ${v.kind === 'internal' ? '<span class="tag">Lean</span>' : ''}<div class="d">${esc([device(v.user_agent), v.country].filter(Boolean).join(', '))}</div></div>
            <div class="num d">${dur(v.seconds_visible)} on page</div>
          </div>`).join('')}</div>`
          : '<div class="empty">No visits yet. A visit is recorded once someone keeps the page open for 10 seconds.</div>'}
      </section>`;

    $('shareForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.submitter; btn.disabled = true;
      $('shareErr').textContent = '';
      const by = $('by').value.trim();
      localStorage.setItem('leanbp-by', by);
      try {
        const link = await api('/api/admin/links', { method: 'POST', body: JSON.stringify({ slug: bp.slug, label: $('label').value, kind: $('kind').value, createdBy: by }) });
        await load();
        $('created').innerHTML = `<div class="created"><code>${esc(link.url)}</code><button class="ghost" id="copyNew">Copy link</button></div>`;
        $('copyNew').addEventListener('click', () => copy(link.url));
      } catch (err) {
        $('shareErr').textContent = err.message;
      } finally { btn.disabled = false; }
    });
    $('replaceFile').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      if (!confirm(`Replace the file for "${bp.title}" with ${file.name}? Clients with a link will see the new version straight away.`)) { e.target.value = ''; return; }
      try {
        const r = await api('/api/admin/blueprints', { method: 'POST', body: JSON.stringify({ slug: bp.slug, html: await file.text(), uploadedBy: localStorage.getItem('leanbp-by') || '', replace: true }) });
        await load();
        status('File replaced');
        if (r.droppedTicks.length) $('replaceMsg').innerHTML = `<div class="warn">These ticked items aren’t in the new file, so their ticks no longer show: ${esc(r.droppedTicks.join(', '))}. Restore the keys in the file to bring them back.</div>`;
      } catch (err) { $('replaceMsg').innerHTML = `<div class="warn">${esc(err.message)}</div>`; }
    });
    document.querySelectorAll('[data-copy]').forEach((el) => el.addEventListener('click', () => copy(location.origin + '/b/' + el.dataset.copy)));
    document.querySelectorAll('[data-revoke]').forEach((el) => el.addEventListener('click', async () => {
      const revoking = el.dataset.state === 'active';
      if (revoking && !confirm('Revoke this link? Anyone using it will see an "isn’t active" page.')) return;
      try { await api('/api/admin/links', { method: 'PATCH', body: JSON.stringify({ token: el.dataset.revoke, revoked: revoking }) }); await load(); status(revoking ? 'Link revoked' : 'Link restored'); }
      catch (err) { status(err.message); }
    }));
  }

  function renderUpload() {
    $('main').innerHTML = `
      <h2>Add a blueprint</h2>
      <p class="sub">Upload a client’s blueprint as a single HTML file. You can create links for it straight after.</p>
      <form class="upload" id="uploadForm">
        <div><label for="upFile">Blueprint file</label><input id="upFile" type="file" accept=".html,.htm,text/html" required>
          <div class="hint">One self-contained HTML page under 4 MB, with a &lt;title&gt;. Checklist items need a data-check key.</div></div>
        <div><label for="upSlug">Short name</label><input id="upSlug" type="text" maxlength="63" placeholder="e.g. acme-remit" required>
          <div class="hint">Lowercase letters, digits and hyphens. Only your team sees it; clients get private links.</div></div>
        <div><label for="upBy">Your name</label><input id="upBy" type="text" maxlength="80" value="${esc(localStorage.getItem('leanbp-by') || '')}"></div>
        <div><button class="primary" type="submit">Upload blueprint</button></div>
        <div class="err" id="upErr" role="alert"></div>
      </form>`;
    $('upFile').addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f && !$('upSlug').value) $('upSlug').value = f.name.replace(/\.html?$/i, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 63);
    });
    $('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.submitter; btn.disabled = true; $('upErr').textContent = '';
      const by = $('upBy').value.trim(); localStorage.setItem('leanbp-by', by);
      try {
        const file = $('upFile').files[0];
        if (file.size > 4_000_000) throw new Error('The file is over 4 MB. Compress or resize its embedded images, then try again.');
        const r = await api('/api/admin/blueprints', { method: 'POST', body: JSON.stringify({ slug: $('upSlug').value.trim(), html: await file.text(), uploadedBy: by }) });
        selected = r.slug; history.replaceState(null, '', '#' + r.slug);
        await load();
        status('Blueprint uploaded');
      } catch (err) { $('upErr').textContent = err.message; }
      finally { btn.disabled = false; }
    });
  }

  function copy(text) {
    navigator.clipboard.writeText(text).then(() => status('Link copied'), () => prompt('Copy this link:', text));
  }
  let st;
  function status(msg) {
    let el = document.querySelector('.status');
    if (!el) { el = document.createElement('div'); el.className = 'status'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg; clearTimeout(st); st = setTimeout(() => el.remove(), 2500);
  }

  if (password) load().catch(signOut); else signOut();
})();
</script>
</body>
</html>
